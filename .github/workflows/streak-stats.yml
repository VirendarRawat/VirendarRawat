name: Update Streak Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: "user=${{ github.repository_owner }}&theme=radical&hide_border=true&background=0d1117&timezone=Asia/Kolkata"
          path: "streak.svg"
          token: ${{ secrets.STREAK_STATS_TOKEN }}
