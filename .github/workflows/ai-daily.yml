name: AI Daily Note

on:
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-ai-note:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI note
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          api_key = os.environ["GROQ_API_KEY"]

          today = datetime.now(timezone.utc).strftime("%B %d, %Y")

          prompt = f"""
          You are the AI voice behind the GitHub profile of Virendar Rawat.

          Profile:
          - Full-Stack & AI Engineer
          - MCA graduate
          - Interests: Full-Stack Development, AI, Data Analytics,
            Software Engineering, Cybersecurity and Post-Quantum Cryptography
          - Currently building practical software projects
          - Currently learning and experimenting with modern technologies

          Write ONE short first-person reflection for his GitHub profile.

          Requirements:
          - 2 to 3 sentences
          - 35 to 55 words maximum
          - natural and human
          - thoughtful but not dramatic
          - professional but not corporate
          - mention a technical learning or building theme
          - do not invent achievements
          - do not claim that a project was completed unless explicitly stated
          - do not use hashtags
          - do not use quotation marks
          - return ONLY the reflection text

          Today's date: {today}
          """

          payload = {
              "model": "llama-3.3-70b-versatile",
              "messages": [
                  {
                      "role": "system",
                      "content": "You write concise, authentic developer profile reflections."
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.8,
              "max_completion_tokens": 120
          }

          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}"
              },
              method="POST"
          )

          try:
    with urllib.request.urlopen(request) as response:
        result = json.loads(response.read().decode("utf-8"))
except urllib.error.HTTPError as error:
    error_body = error.read().decode("utf-8", errors="replace")
    print("Groq API error:")
    print(error_body)
    raise

note = result["choices"][0]["message"]["content"].strip()

          readme_path = "README.md"

          with open(readme_path, "r", encoding="utf-8") as file:
              readme = file.read()

          start_marker = "<!-- AI_DAILY_START -->"
          end_marker = "<!-- AI_DAILY_END -->"

          replacement = f"""<!-- AI_DAILY_START -->

          ## 🤖 A Note From My AI

          <p align="center">
            <i>{note}</i>
          </p>

          <p align="center">
            <sub>Generated by AI • {today}</sub>
          </p>

          <!-- AI_DAILY_END -->"""

          start = readme.find(start_marker)
          end = readme.find(end_marker)

          if start == -1 or end == -1:
              raise RuntimeError(
                  "AI Daily markers were not found in README.md"
              )

          end += len(end_marker)

          readme = (
              readme[:start]
              + replacement
              + readme[end:]
          )

          with open(readme_path, "w", encoding="utf-8") as file:
              file.write(readme)

          print("AI Daily note generated successfully.")

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes detected."
            exit 0
          fi

          git commit -m "chore: update AI daily note"
          git push
